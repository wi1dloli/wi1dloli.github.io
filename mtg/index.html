<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Single viewport meta tag with all settings -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <!-- iOS 9 image loading -->
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Content-Security-Policy" content="img-src * data: blob:; default-src * 'unsafe-inline' 'unsafe-eval' data: blob:;">
    <title>wi1dtrack - MTG Game Tracker</title>
    
    <!-- Polyfills for iOS 9.3.5 -->
    <script src="https://cdn.jsdelivr.net/npm/whatwg-fetch@3.6.2/dist/fetch.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/promise-polyfill@8.2.3/dist/polyfill.min.js"></script>
    
    <link rel="stylesheet" href="styles.css">
    
    <!-- Disable double-tap zoom with CSS -->
    <style>
        /* Disable double-tap zoom on iOS */
        * {
            touch-action: manipulation;
        }
        /* Make rules text scrollable */
        .token-rules-scroll {
            max-height: 40px;
            overflow-y: auto;
            scrollbar-width: thin;
            -webkit-overflow-scrolling: touch;
        }
        .token-rules-scroll::-webkit-scrollbar {
            width: 3px;
        }
        .token-rules-scroll::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
        }
        .token-rules-scroll::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.3);
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <header>
        <h1>wi1dtrack</h1>
    </header>

    <!-- Master Two-Column Grid Layout -->
    <div class="game-layout">
        
        <!-- LEFT COLUMN: Token Builder and Display Board Grid -->
        <div class="left-col">
            <div class="card form-card">
                <h2>Create Tokens</h2>
                <form id="token-form" onsubmit="return handleNewToken(event)" autocomplete="off">
                    
                    <!-- Token name container with autocomplete -->
                    <div class="form-group" style="position: relative;">
                        <label for="token-name">Token Name</label>
                        <input type="text" id="token-name" placeholder="e.g., Soldier, Zombie, Treasure" required oninput="handleNameInput(this.value)">
                        
                        <!-- Autocomplete Suggestions Panel -->
                        <div id="autocomplete-box" class="autocomplete-suggestions"></div>
                    </div>
                    
                    <!-- Inline row for stats -->
                    <div class="compact-row">
                        <div class="input-inline">
                            <label for="token-pow">PWR</label>
                            <input type="text" id="token-pow" value="1" placeholder="*">
                        </div>
                        <div class="input-inline">
                            <label for="token-tou">TGH</label>
                            <input type="text" id="token-tou" value="1" placeholder="*">
                        </div>
                        <div class="input-inline">
                            <label for="token-qty-input">AMT</label>
                            <input type="number" id="token-qty-input" value="1" min="1" required>
                        </div>
                        <div class="input-inline">
                            <label for="token-color">CLR</label>
                            <select id="token-color">
                                <option value="W">White</option>
                                <option value="U">Blue</option>
                                <option value="B">Black</option>
                                <option value="R">Red</option>
                                <option value="G">Green</option>
                                <option value="C">Colorless</option>
                                <option value="M" selected>Multi</option>
                            </select>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary">Add Tokens</button>
                </form>
            </div>
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
                <h2 style="margin:0;">Active Tokens</h2>
                <button id="edit-toggle" class="btn-edit" onclick="toggleEditMode()">🔀 Edit</button>
            </div>
            <div id="token-grid" class="token-grid"></div>

            <!-- Token Detail Modal -->
            <div id="token-modal" class="token-modal" style="display:none;">
            <div class="token-modal-content">
            <button class="token-modal-close" onclick="closeTokenModal()">✕</button>
            <div id="token-modal-body"></div>
    </div>
</div>
        </div>

        <!-- RIGHT COLUMN: Sticky Side Panel -->
        <div class="right-col">
            <div class="card life-card sticky-life">
                <h2>Life</h2>
                <div class="life-row">
                    <div id="life-display" class="life-display">40</div>
                    <div class="life-controls">
                        <button class="btn-life" 
                            onclick="adjustLife(1)"
                            onmousedown="startLifeHold(1)" 
                            onmouseup="stopLifeHold()" 
                            onmouseleave="stopLifeHold()"
                            ontouchstart="startLifeHold(1)" 
                            ontouchend="stopLifeHold()" 
                            ontouchcancel="stopLifeHold()">+</button>
                        <button class="btn-life" 
                            onclick="adjustLife(-1)"
                            onmousedown="startLifeHold(-1)" 
                            onmouseup="stopLifeHold()" 
                            onmouseleave="stopLifeHold()"
                            ontouchstart="startLifeHold(-1)" 
                            ontouchend="stopLifeHold()" 
                            ontouchcancel="stopLifeHold()">-</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
